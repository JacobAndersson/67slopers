</style>
<rect class="b b1" x="9" y="35" width="22" height="58" rx="11"/><rect class="b b2" x="39" y="21" width="22" height="58" rx="11"/><rect class="b b3" x="69" y="7" width="22" height="58" rx="11"/></svg>