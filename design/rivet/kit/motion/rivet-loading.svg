<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -14 100 114" width="100" height="114" role="img" aria-label="Loading">
<style>
.b{fill:#141A2E;animation:lift 1.2s cubic-bezier(.3,.7,.2,1) infinite}
.b2{animation-delay:.12s} .b3{animation-delay:.24s}
