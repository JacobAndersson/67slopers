<svg xmlns="http://www.w3.org/2000/svg" width="390" height="2688" viewBox="0 0 390 2688"><rect width="100%" height="100%" fill="#fafaf7"/><text x="24" y="23.02" font-family="Geist Mono" font-size="12" font-weight="600" fill="#20221f">9:41</text><rect x="342" y="15" width="22" height="10" rx="2" fill="none" stroke="#20221f"/><rect x="344" y="17" width="17" height="6" rx="1" fill="#20221f" stroke="none"/><path d="M165.66 202.34a8 8 0 0 1-11.32 11.32l-80-80a8 8 0 0 1 0-11.32l80-80a8 8 0 0 1 11.32 11.32L91.31 128Z" transform="translate(20 54) scale(0.09375)" fill="#20221f" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="108.312" y="73.78" font-family="Geist Mono" font-size="18" font-weight="600" fill="#20221f">Classic workouts</text><text x="24" y="128.44" font-family="Geist Mono" font-size="14" font-weight="400" fill="#33352d">Classic protocols with their usual</text><text x="24" y="148.44" font-family="Geist Mono" font-size="14" font-weight="400" fill="#33352d">numbers. Open one to start it as is,</text><text x="24" y="168.44" font-family="Geist Mono" font-size="14" font-weight="400" fill="#33352d">tweak it, or save it to your workouts.</text><text x="24" y="221.7" font-family="Geist Mono" font-size="20" font-weight="600" fill="#20221f">Beginner</text><rect x="24" y="248" width="342" height="189" rx="12" fill="#ffffff" stroke="#d3d5cd"/><text x="44" y="287.78" font-family="Geist Mono" font-size="18" font-weight="600" fill="#20221f">First hangs</text><text x="309.88" y="284.02" font-family="Geist Mono" font-size="12" font-weight="500" fill="#33352d">18:10</text><text x="44" y="319.44" font-family="Geist Mono" font-size="14" font-weight="400" fill="#33352d">2 × (6 × 10s / 50s · rest 3:00)</text><text x="44" y="353.44" font-family="Geist Mono" font-size="14" font-weight="400" fill="#33352d">The 10:50 introduction. Jugs or the</text><text x="44" y="377.44" font-family="Geist Mono" font-size="14" font-weight="400" fill="#33352d">biggest edge, feet on a chair if</text><text x="44" y="401.44" font-family="Geist Mono" font-size="14" font-weight="400" fill="#33352d">you need them. Stop every hang well</text><text x="44" y="425.44" font-family="Geist Mono" font-size="14" font-weight="400" fill="#33352d">before your grip starts to open.</text><rect x="24" y="449" width="342" height="237" rx="12" fill="#ffffff" stroke="#d3d5cd"/><text x="44" y="488.78" font-family="Geist Mono" font-size="18" font-weight="600" fill="#20221f">No-hangs, Emil style</text><text x="317.104" y="485.02" font-family="Geist Mono" font-size="12" font-weight="500" fill="#33352d">8:10</text><text x="44" y="520.44" font-family="Geist Mono" font-size="14" font-weight="400" fill="#33352d">8 × (10s · rest 50s)</text><text x="44" y="554.44" font-family="Geist Mono" font-size="14" font-weight="400" fill="#33352d">Emil Abrahamsson’s daily routine:</text><text x="44" y="578.44" font-family="Geist Mono" font-size="14" font-weight="400" fill="#33352d">feet stay on the floor and you load</text><text x="44" y="602.44" font-family="Geist Mono" font-size="14" font-weight="400" fill="#33352d">the fingers to about 70–80 %</text><text x="44" y="626.44" font-family="Geist Mono" font-size="14" font-weight="400" fill="#33352d">effort. Short and easy on purpose.</text><text x="44" y="650.44" font-family="Geist Mono" font-size="14" font-weight="400" fill="#33352d">Twice a day, at least six hours</text><text x="44" y="674.44" font-family="Geist Mono" font-size="14" font-weight="400" fill="#33352d">apart.</text><rect x="24" y="698" width="342" height="213" rx="12" fill="#ffffff" stroke="#d3d5cd"/><text x="44" y="737.78" font-family="Geist Mono" font-size="18" font-weight="600" fill="#20221f">Density hangs</text><text x="309.88" y="734.02" font-family="Geist Mono" font-size="12" font-weight="500" fill="#33352d">10:10</text><text x="44" y="769.44" font-family="Geist Mono" font-size="14" font-weight="400" fill="#33352d">4 × (30s · rest 2:00)</text><text x="44" y="803.44" font-family="Geist Mono" font-size="14" font-weight="400" fill="#33352d">Longer hangs at about half effort.</text><text x="44" y="827.44" font-family="Geist Mono" font-size="14" font-weight="400" fill="#33352d">Pick a hold you can hang for the</text><text x="44" y="851.44" font-family="Geist Mono" font-size="14" font-weight="400" fill="#33352d">full 30 s with something in</text><text x="44" y="875.44" font-family="Geist Mono" font-size="14" font-weight="400" fill="#33352d">reserve; the edge sets the</text><text x="44" y="899.44" font-family="Geist Mono" font-size="14" font-weight="400" fill="#33352d">difficulty, not added weight.</text><text x="24" y="966.7" font-family="Geist Mono" font-size="20" font-weight="600" fill="#20221f">Intermediate</text><rect x="24" y="993" width="342" height="189" rx="12" fill="#ffffff" stroke="#d3d5cd"/><text x="44" y="1032.78" font-family="Geist Mono" font-size="18" font-weight="600" fill="#20221f">Repeaters 7:3</text><text x="309.88" y="1029.02" font-family="Geist Mono" font-size="12" font-weight="500" fill="#33352d">24:10</text><text x="44" y="1064.44" font-family="Geist Mono" font-size="14" font-weight="400" fill="#33352d">6 × (6 × 7s / 3s · rest 3:00)</text><text x="44" y="1098.44" font-family="Geist Mono" font-size="14" font-weight="400" fill="#33352d">The classic strength-endurance set:</text><text x="44" y="1122.44" font-family="Geist Mono" font-size="14" font-weight="400" fill="#33352d">7 s on, 3 s off for six reps, six</text><text x="44" y="1146.44" font-family="Geist Mono" font-size="14" font-weight="400" fill="#33352d">sets with three minutes between.</text><text x="44" y="1170.44" font-family="Geist Mono" font-size="14" font-weight="400" fill="#33352d">Same edge and grip for every set.</text><rect x="24" y="1194" width="342" height="189" rx="12" fill="#ffffff" stroke="#d3d5cd"/><text x="44" y="1233.78" font-family="Geist Mono" font-size="18" font-weight="600" fill="#20221f">Max hangs</text><text x="309.88" y="1230.02" font-family="Geist Mono" font-size="12" font-weight="500" fill="#33352d">16:00</text><text x="44" y="1265.44" font-family="Geist Mono" font-size="14" font-weight="400" fill="#33352d">5 × (10s · rest 3:00)</text><text x="44" y="1299.44" font-family="Geist Mono" font-size="14" font-weight="400" fill="#33352d">Five near-maximal 10 s hangs with</text><text x="44" y="1323.44" font-family="Geist Mono" font-size="14" font-weight="400" fill="#33352d">three minutes rest. Add weight or</text><text x="44" y="1347.44" font-family="Geist Mono" font-size="14" font-weight="400" fill="#33352d">shrink the edge until the last hang</text><text x="44" y="1371.44" font-family="Geist Mono" font-size="14" font-weight="400" fill="#33352d">is hard but clean.</text><rect x="24" y="1395" width="342" height="189" rx="12" fill="#ffffff" stroke="#d3d5cd"/><text x="44" y="1434.78" font-family="Geist Mono" font-size="18" font-weight="600" fill="#20221f">Minimum edge hangs</text><text x="309.88" y="1431.02" font-family="Geist Mono" font-size="12" font-weight="500" fill="#33352d">16:00</text><text x="44" y="1466.44" font-family="Geist Mono" font-size="14" font-weight="400" fill="#33352d">5 × (10s · rest 3:00)</text><text x="44" y="1500.44" font-family="Geist Mono" font-size="14" font-weight="400" fill="#33352d">Max hangs without added weight: the</text><text x="44" y="1524.44" font-family="Geist Mono" font-size="14" font-weight="400" fill="#33352d">smallest edge you can hold for 10</text><text x="44" y="1548.44" font-family="Geist Mono" font-size="14" font-weight="400" fill="#33352d">s. Move down one edge size when a</text><text x="44" y="1572.44" font-family="Geist Mono" font-size="14" font-weight="400" fill="#33352d">set feels easy.</text><rect x="24" y="1596" width="342" height="253" rx="12" fill="#ffffff" stroke="#d3d5cd"/><text x="44" y="1635.78" font-family="Geist Mono" font-size="18" font-weight="600" fill="#20221f">Two-grip repeaters</text><text x="309.88" y="1632.02" font-family="Geist Mono" font-size="12" font-weight="500" fill="#33352d">27:10</text><text x="44" y="1667.44" font-family="Geist Mono" font-size="14" font-weight="400" fill="#33352d">3 × (6 × 7s / 3s · rest 3:00) ·</text><text x="44" y="1687.44" font-family="Geist Mono" font-size="14" font-weight="400" fill="#33352d">rest 3:00 · 3 × (6 × 7s / 3s · rest</text><text x="44" y="1707.44" font-family="Geist Mono" font-size="14" font-weight="400" fill="#33352d">3:00)</text><text x="44" y="1741.44" font-family="Geist Mono" font-size="14" font-weight="400" fill="#33352d">Repeaters split across two grips:</text><text x="44" y="1765.44" font-family="Geist Mono" font-size="14" font-weight="400" fill="#33352d">three sets on half crimp, then</text><text x="44" y="1789.44" font-family="Geist Mono" font-size="14" font-weight="400" fill="#33352d">three on open hand. Change the</text><text x="44" y="1813.44" font-family="Geist Mono" font-size="14" font-weight="400" fill="#33352d">labels to whatever grips you are</text><text x="44" y="1837.44" font-family="Geist Mono" font-size="14" font-weight="400" fill="#33352d">training.</text><text x="24" y="1904.7" font-family="Geist Mono" font-size="20" font-weight="600" fill="#20221f">Advanced</text><rect x="24" y="1931" width="342" height="213" rx="12" fill="#ffffff" stroke="#d3d5cd"/><text x="44" y="1970.78" font-family="Geist Mono" font-size="18" font-weight="600" fill="#20221f">7/53 max weight</text><text x="309.88" y="1967.02" font-family="Geist Mono" font-size="12" font-weight="500" fill="#33352d">13:40</text><text x="44" y="2002.44" font-family="Geist Mono" font-size="14" font-weight="400" fill="#33352d">3 × (3 × 7s / 53s · rest 1:30)</text><text x="44" y="2036.44" font-family="Geist Mono" font-size="14" font-weight="400" fill="#33352d">Eric Hörst’s weighted protocol: 7 s</text><text x="44" y="2060.44" font-family="Geist Mono" font-size="14" font-weight="400" fill="#33352d">hangs with 53 s rest, three per</text><text x="44" y="2084.44" font-family="Geist Mono" font-size="14" font-weight="400" fill="#33352d">set, three sets. Load so that a</text><text x="44" y="2108.44" font-family="Geist Mono" font-size="14" font-weight="400" fill="#33352d">single 10 s hang would be your</text><text x="44" y="2132.44" font-family="Geist Mono" font-size="14" font-weight="400" fill="#33352d">limit, about 96 % of max.</text><rect x="24" y="2156" width="342" height="233" rx="12" fill="#ffffff" stroke="#d3d5cd"/><text x="44" y="2195.78" font-family="Geist Mono" font-size="18" font-weight="600" fill="#20221f">One-arm hangs</text><text x="309.88" y="2192.02" font-family="Geist Mono" font-size="12" font-weight="500" fill="#33352d">16:30</text><text x="44" y="2227.44" font-family="Geist Mono" font-size="14" font-weight="400" fill="#33352d">5 × (8s · rest 30s · 8s · rest</text><text x="44" y="2247.44" font-family="Geist Mono" font-size="14" font-weight="400" fill="#33352d">2:30)</text><text x="44" y="2281.44" font-family="Geist Mono" font-size="14" font-weight="400" fill="#33352d">For climbers who would need more</text><text x="44" y="2305.44" font-family="Geist Mono" font-size="14" font-weight="400" fill="#33352d">added weight than is practical.</text><text x="44" y="2329.44" font-family="Geist Mono" font-size="14" font-weight="400" fill="#33352d">Eight seconds per arm on a big edge</text><text x="44" y="2353.44" font-family="Geist Mono" font-size="14" font-weight="400" fill="#33352d">or jug; use a pulley or a foot to</text><text x="44" y="2377.44" font-family="Geist Mono" font-size="14" font-weight="400" fill="#33352d">take weight off if you need to.</text><rect x="24" y="2401" width="342" height="229" rx="12" fill="#ffffff" stroke="#d3d5cd"/><text x="44" y="2440.78" font-family="Geist Mono" font-size="18" font-weight="600" fill="#20221f">Three-grip max hangs</text><text x="309.88" y="2437.02" font-family="Geist Mono" font-size="12" font-weight="500" fill="#33352d">34:40</text><text x="44" y="2472.44" font-family="Geist Mono" font-size="14" font-weight="400" fill="#33352d">3 × (10s · rest 3:00) · rest 3:00 ·</text><text x="44" y="2492.44" font-family="Geist Mono" font-size="14" font-weight="400" fill="#33352d">3 × (10s · rest 3:00) · rest 3:00 ·</text><text x="44" y="2512.44" font-family="Geist Mono" font-size="14" font-weight="400" fill="#33352d">3 × (10s · rest 3:00)</text><text x="44" y="2546.44" font-family="Geist Mono" font-size="14" font-weight="400" fill="#33352d">Three max hangs on each of three</text><text x="44" y="2570.44" font-family="Geist Mono" font-size="14" font-weight="400" fill="#33352d">grips, three minutes between every</text><text x="44" y="2594.44" font-family="Geist Mono" font-size="14" font-weight="400" fill="#33352d">hang. A full session for climbers</text><text x="44" y="2618.44" font-family="Geist Mono" font-size="14" font-weight="400" fill="#33352d">who have outgrown a single grip.</text><rect x="20" y="54" width="24" height="24" rx="0" fill="#ffffff" stroke="none" opacity="0.001"/><rect x="24" y="248" width="342" height="189" rx="0" fill="#ffffff" stroke="none" opacity="0.001"/><rect x="24" y="449" width="342" height="237" rx="0" fill="#ffffff" stroke="none" opacity="0.001"/><rect x="24" y="698" width="342" height="213" rx="0" fill="#ffffff" stroke="none" opacity="0.001"/><rect x="24" y="993" width="342" height="189" rx="0" fill="#ffffff" stroke="none" opacity="0.001"/><rect x="24" y="1194" width="342" height="189" rx="0" fill="#ffffff" stroke="none" opacity="0.001"/><rect x="24" y="1395" width="342" height="189" rx="0" fill="#ffffff" stroke="none" opacity="0.001"/><rect x="24" y="1596" width="342" height="253" rx="0" fill="#ffffff" stroke="none" opacity="0.001"/><rect x="24" y="1931" width="342" height="213" rx="0" fill="#ffffff" stroke="none" opacity="0.001"/><rect x="24" y="2156" width="342" height="233" rx="0" fill="#ffffff" stroke="none" opacity="0.001"/><rect x="24" y="2401" width="342" height="229" rx="0" fill="#ffffff" stroke="none" opacity="0.001"/></svg>