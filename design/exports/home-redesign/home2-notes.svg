<svg xmlns="http://www.w3.org/2000/svg" width="2350" height="880" viewBox="0 0 2350 880"><defs></defs><rect width="100%" height="100%" fill="#fafaf7"/><text x="48" y="47.724" font-family="Geist Mono" font-size="12" font-weight="500" fill="#33352d">67SLOPERS / HOME REDESIGN</text><text x="48" y="115.172" font-family="Geist Mono" font-size="36" font-weight="800" fill="#20221f">Home says hello, then steps aside</text><text x="48" y="153.632" font-family="Geist Mono" font-size="16" font-weight="400" fill="#33352d">The app is no longer only a hangboard timer, so Home stops leading with one. It opens with a line that follows the clock,</text><text x="48" y="177.632" font-family="Geist Mono" font-size="16" font-weight="400" fill="#33352d">then offers both ways to train as equals, whichever you did last on top.</text><text x="48" y="243.632" font-family="Geist Mono" font-size="16" font-weight="600" fill="#20221f">A greeting by the clock</text><text x="48" y="267.22400000000005" font-family="Geist Mono" font-size="12" font-weight="500" fill="#33352d">98 lines in seven parts of the day, plus a few for some weekdays. A</text><text x="48" y="285.22400000000005" font-family="Geist Mono" font-size="12" font-weight="500" fill="#33352d">couple of words, never a sentence. One line holds for that part of that</text><text x="48" y="303.22400000000005" font-family="Geist Mono" font-size="12" font-weight="500" fill="#33352d">day, so it never changes between two glances.</text><text x="618" y="243.632" font-family="Geist Mono" font-size="16" font-weight="600" fill="#20221f">Two equal cards</text><text x="618" y="267.22400000000005" font-family="Geist Mono" font-size="12" font-weight="500" fill="#33352d">Hangboard and MoonBoard are the same size and shape: what you did last,</text><text x="618" y="285.22400000000005" font-family="Geist Mono" font-size="12" font-weight="500" fill="#33352d">one tap from doing it again. The big Next up hero is gone.</text><text x="1188" y="243.632" font-family="Geist Mono" font-size="16" font-weight="600" fill="#20221f">The last one used comes first</text><text x="1188" y="267.22400000000005" font-family="Geist Mono" font-size="12" font-weight="500" fill="#33352d">Train on the board in the evening and it is on top the next time; hang</text><text x="1188" y="285.22400000000005" font-family="Geist Mono" font-size="12" font-weight="500" fill="#33352d">in the morning and the workout is.</text><text x="1758" y="243.632" font-family="Geist Mono" font-size="16" font-weight="600" fill="#20221f">Nothing to set up, nothing to nag</text><text x="1758" y="267.22400000000005" font-family="Geist Mono" font-size="12" font-weight="500" fill="#33352d">A card for something not set up yet is an outline with one line of</text><text x="1758" y="285.22400000000005" font-family="Geist Mono" font-size="12" font-weight="500" fill="#33352d">text, and can be left alone.</text><text x="48" y="391.53999999999996" font-family="Geist Mono" font-size="20" font-weight="600" fill="#20221f">All 98 greetings</text><text x="48" y="432.22400000000005" font-family="Geist Mono" font-size="12" font-weight="600" fill="#33352d">SMALL HOURS · 0–5</text><text x="48" y="460.22400000000005" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">Still up?</text><text x="48" y="488.22400000000005" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">Midnight session</text><text x="48" y="516.224" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">Night shift</text><text x="48" y="544.224" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">Midnight chalk</text><text x="48" y="572.224" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">One last go</text><text x="48" y="600.224" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">Late one</text><text x="48" y="628.224" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">Quiet hours</text><text x="48" y="656.224" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">Go to bed</text><text x="48" y="684.224" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">Insomnia gains</text><text x="48" y="712.224" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">Shh, neighbours</text><text x="48" y="740.224" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">Sleep is training too</text><text x="48" y="768.224" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">Up late again</text><text x="334" y="432.22400000000005" font-family="Geist Mono" font-size="12" font-weight="600" fill="#33352d">EARLY · 5–9</text><text x="334" y="460.22400000000005" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">Dawn patrol</text><text x="334" y="488.22400000000005" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">Up early</text><text x="334" y="516.224" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">First light</text><text x="334" y="544.224" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">Rise and hang</text><text x="334" y="572.224" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">Early bird</text><text x="334" y="600.224" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">Coffee first</text><text x="334" y="628.224" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">Sunrise session</text><text x="334" y="656.224" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">Cold holds</text><text x="334" y="684.224" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">Good morning, early one</text><text x="334" y="712.224" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">Before work?</text><text x="334" y="740.224" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">Morning, fresh skin</text><text x="334" y="768.224" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">Up with the sun</text><text x="620" y="432.22400000000005" font-family="Geist Mono" font-size="12" font-weight="600" fill="#33352d">MORNING · 9–12</text><text x="620" y="460.22400000000005" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">Good morning</text><text x="620" y="488.22400000000005" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">Morning</text><text x="620" y="516.224" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">Fresh skin</text><text x="620" y="544.224" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">Chalk up</text><text x="620" y="572.224" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">Rise and crimp</text><text x="620" y="600.224" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">Sending day</text><text x="620" y="628.224" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">Morning, crusher</text><text x="620" y="656.224" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">Fingers awake?</text><text x="620" y="684.224" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">Hello, sunshine</text><text x="620" y="712.224" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">Top of the morning</text><text x="620" y="740.224" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">Ready to pull?</text><text x="620" y="768.224" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">Warm up first</text><text x="906" y="432.22400000000005" font-family="Geist Mono" font-size="12" font-weight="600" fill="#33352d">MIDDAY · 12–14</text><text x="906" y="460.22400000000005" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">Lunch break hangs</text><text x="906" y="488.22400000000005" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">High noon</text><text x="906" y="516.224" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">Midday pull</text><text x="906" y="544.224" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">Hello there</text><text x="906" y="572.224" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">Lunch crimps</text><text x="906" y="600.224" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">Noon session</text><text x="906" y="628.224" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">Quick set?</text><text x="906" y="656.224" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">Desk break</text><text x="906" y="684.224" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">Good day</text><text x="906" y="712.224" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">Hungry for edges</text><text x="906" y="740.224" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">Midday, crusher</text><text x="906" y="768.224" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">Snack, then hang</text><text x="1192" y="432.22400000000005" font-family="Geist Mono" font-size="12" font-weight="600" fill="#33352d">AFTERNOON · 14–17</text><text x="1192" y="460.22400000000005" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">Good afternoon</text><text x="1192" y="488.22400000000005" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">Afternoon</text><text x="1192" y="516.224" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">Shake it out</text><text x="1192" y="544.224" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">Afternoon burn</text><text x="1192" y="572.224" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">Project time</text><text x="1192" y="600.224" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">Coffee wore off?</text><text x="1192" y="628.224" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">Three o clock crimps</text><text x="1192" y="656.224" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">Hey there</text><text x="1192" y="684.224" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">Afternoon, crusher</text><text x="1192" y="712.224" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">Try hard hours</text><text x="1192" y="740.224" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">Good conditions</text><text x="1192" y="768.224" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">Small holds, big plans</text><text x="1478" y="432.22400000000005" font-family="Geist Mono" font-size="12" font-weight="600" fill="#33352d">EVENING · 17–21</text><text x="1478" y="460.22400000000005" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">Good evening</text><text x="1478" y="488.22400000000005" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">Evening</text><text x="1478" y="516.224" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">Prime time</text><text x="1478" y="544.224" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">Clocked out</text><text x="1478" y="572.224" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">Chalked up</text><text x="1478" y="600.224" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">After work burn</text><text x="1478" y="628.224" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">Evening session</text><text x="1478" y="656.224" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">Send o clock</text><text x="1478" y="684.224" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">Evening, crusher</text><text x="1478" y="712.224" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">One more burn</text><text x="1478" y="740.224" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">Light it up</text><text x="1478" y="768.224" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">Golden hour</text><text x="1764" y="432.22400000000005" font-family="Geist Mono" font-size="12" font-weight="600" fill="#33352d">NIGHT · 21–24</text><text x="1764" y="460.22400000000005" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">Night owl</text><text x="1764" y="488.22400000000005" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">Late session</text><text x="1764" y="516.224" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">One more set</text><text x="1764" y="544.224" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">Evening wind-down</text><text x="1764" y="572.224" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">Last go?</text><text x="1764" y="600.224" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">Lights low</text><text x="1764" y="628.224" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">Good night, almost</text><text x="1764" y="656.224" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">Quiet feet</text><text x="1764" y="684.224" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">Late burn</text><text x="1764" y="712.224" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">Short and sharp</text><text x="1764" y="740.224" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">Before bed</text><text x="1764" y="768.224" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">Moonlight session</text><text x="2050" y="432.22400000000005" font-family="Geist Mono" font-size="12" font-weight="600" fill="#33352d">SOME DAYS · 5–21</text><text x="2050" y="460.22400000000005" font-family="Geist Mono" font-size="12" font-weight="500" fill="#33352d">Mon</text><text x="2090" y="460.22400000000005" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">Fresh week</text><text x="2050" y="488.22400000000005" font-family="Geist Mono" font-size="12" font-weight="500" fill="#33352d">Mon</text><text x="2090" y="488.22400000000005" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">Monday, fresh skin</text><text x="2050" y="516.224" font-family="Geist Mono" font-size="12" font-weight="500" fill="#33352d">Mon</text><text x="2090" y="516.224" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">New week</text><text x="2050" y="544.224" font-family="Geist Mono" font-size="12" font-weight="500" fill="#33352d">Wed</text><text x="2090" y="544.224" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">Midweek burn</text><text x="2050" y="572.224" font-family="Geist Mono" font-size="12" font-weight="500" fill="#33352d">Wed</text><text x="2090" y="572.224" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">Halfway there</text><text x="2050" y="600.224" font-family="Geist Mono" font-size="12" font-weight="500" fill="#33352d">Fri</text><text x="2090" y="600.224" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">Friday fingers</text><text x="2050" y="628.224" font-family="Geist Mono" font-size="12" font-weight="500" fill="#33352d">Fri</text><text x="2090" y="628.224" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">Send it, Friday</text><text x="2050" y="656.224" font-family="Geist Mono" font-size="12" font-weight="500" fill="#