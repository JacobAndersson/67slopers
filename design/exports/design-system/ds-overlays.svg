ation dialog</text><rect x="40" y="728" width="390" height="276" rx="12" fill="#fafaf7" stroke="#d3d5cd"/><text x="121.22200000000001" y="774.28" font-family="Geist Mono" font-size="18" font-weight="600" fill="#20221f">Discard this workout?</text><text x="66.44" y="816.44" font-family="Geist Mono" font-size="14" font-weight="400" fill="#33352d">Nothing from it is kept in your history.</text><g transform="translate(24 246)"><rect x="40" y="620" width="342" height="44" rx="10" fill="#20221f" stroke="none"/><text x="181.502" y="648.44" font-family="Geist Mono" font-size="14" font-weight="500" fill="#ffffff">Discard</text></g><g transform="translate(-352 302)"><rect x="416" y="620" width="342" height="44" rx="10" fill="#fafaf7" stroke="#d3d5cd"/><text x="557.502" y="648.44" font-family="Geist Mono" font-size="14" font-weight="500" fill="#20221f">Keep it</text></g><text x="500" y="771.36" font-family="Geist Mono" font-size="16" font-weight="400" fill="#20221f">Mobile: full-width stacked actions.</text><text x="500" y="803.36" font-family="Geist Mono" font-size="16" font-weight="400" fill="#20221f">Use a clear title, consequence, cancel and action.</text><text x="500" y="835.36" font-family="Geist Mono" font-size="16" font-weight="400" fill="#20221f">Confirmation follows a deliberate destructive tap.</text><text x="500" y="867.36" font-family="Geist Mono" font-size="16" font-weight="400" fill="#20221f">Overlay uses 50% black; dialog keeps the app canvas.</text><text x="40" y="1113.2" font-family="Geist Mono" font-size="20" font-weight="600" fill="#20221f">Section header</text><text x="40" y="1179.2" font-family="Geist Mono" font-size="20" font-weight="600" fill="#20221f">Your workouts</text><text x="302" y="1176.44" font-family="Geist Mono" font-size="14" font-weight="500" fill="#20221f">View all</text><text x="460" y="1165.52" font-family="Geist Mono" font-size="12" font-weight="500" fill="#33352d">Title + optional secondary action. Keep section headings aligned to the s