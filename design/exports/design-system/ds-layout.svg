<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1380" viewBox="0 0 1200 1380"><rect width="100%" height="100%" fill="#fafaf7"/><text x="40" y="45.519999999999996" font-family="Geist Mono" font-size="12" font-weight="500" fill="#33352d">67SLOPERS / DESIGN SYSTEM</text><text x="40" y="112.56" font-family="Geist Mono" font-size="36" font-weight="800" fill="#20221f">Rhythm, reach &amp; feedback.</text><text x="40" y="159.36" font-family="Geist Mono" font-size="16" font-weight="400" fill="#33352d">NativeWind values from the app. Mobile samples use 390 px; page content caps at 768 px.</text><rect x="40" y="266" width="88" height="4" rx="0" fill="#f9c65d" stroke="none"/><text x="40" y="357.36" font-family="Geist Mono" font-size="16" font-weight="500" fill="#20221f">4</text><rect x="164" y="266" width="88" height="8" rx="0" fill="#f9c65d" stroke="none"/><text x="164" y="357.36" font-family="Geist Mono" font-size="16" font-weight="500" fill="#20221f">8</text><rect x="288" y="266" width="88" height="12" rx="0" fill="#f9c65d" stroke="none"/><text x="288" y="357.36" font-family="Geist Mono" font-size="16" font-weight="500" fill="#20221f">12</text><rect x="412" y="266" width="88" height="16" rx="0" fill="#f9c65d" stroke="none"/><text x="412" y="357.36" font-family="Geist Mono" font-size="16" font-weight="500" fill="#20221f">16</text><rect x="536" y="266" width="88" height="20" rx="0" fill="#f9c65d" stroke="none"/><text x="536" y="357.36" font-family="Geist Mono" font-size="16" font-weight="500" fill="#20221f">20</text><rect x="660" y="266" width="88" height="24" rx="0" fill="#f9c65d" stroke="none"/><text x="660" y="357.36" font-family="Geist Mono" font-size="16" font-weight="500" fill="#20221f">24</text><rect x="784" y="266" width="88" height="32" rx="0" fill="#f9c65d" stroke="none"/><text x="784" y="357.36" font-family="Geist Mono" font-size="16" font-weight="500" fill="#20221f">32</text><rect x="908" y="266" width="88" height="40" rx="0" fill="#f9c65d" stroke="none"/><text x="908" y="357.36" font-family="Geist Mono" font-size="16" font-weight="500" fill="#20221f">40</text><rect x="1032" y="266" width="88" height="48" rx="0" fill="#f9c65d" stroke="none"/><text x="1032" y="357.36" font-family="Geist Mono" font-size="16" font-weight="500" fill="#20221f">48</text><text x="40" y="437.2" font-family="Geist Mono" font-size="20" font-weight="600" fill="#20221f">Corners &amp; borders</text><rect x="40" y="464" width="160" height="94" rx="8" fill="#ffffff" stroke="#d3d5cd"/><text x="40" y="596.44" font-family="Geist Mono" font-size="14" font-weight="500" fill="#20221f">sm / 8</text><rect x="230" y="464" width="160" height="94" rx="10" fill="#ffffff" stroke="#d3d5cd"/><text x="230" y="596.44" font-family="Geist Mono" font-size="14" font-weight="500" fill="#20221f">md / 10</text><rect x="420" y="464" width="160" height="94" rx="12" fill="#ffffff" stroke="#d3d5cd"/><text x="420" y="596.44" font-family="Geist Mono" font-size="14" font-weight="500" fill="#20221f">lg / 12</text><rect x="610" y="464" width="160" height="94" rx="16" fill="#ffffff" stroke="#d3d5cd"/><text x="610" y="596.44" font-family="Geist Mono" font-size="14" font-weight="500" fill="#20221f">xl / 16</text><text x="840" y="497.36" font-family="Geist Mono" font-size="16" font-weight="400" fill="#20221f">1 px borders</text><text x="840" y="525.36" font-family="Geist Mono" font-size="16" font-weight="400" fill="#20221f">Quiet surfaces</text><text x="840" y="553.36" font-family="Geist Mono" font-size="16" font-weight="400" fill="#20221f">Subtle primitive shadows</text><text x="40" y="695.2" font-family="Geist Mono" font-size="20" font-weight="600" fill="#20221f">Layout contract</text><text x="40" y="746.28" font-family="Geist Mono" font-size="18" font-weight="600" fill="#20221f">Screen</text><text x="40" y="789.36" font-family="Geist Mono" font-size="16" font-weight="400" fill="#20221f">24 px sides / 16 px top</text><text x="40" y="817.36" font-family="Geist Mono" font-size="16" font-weight="400" fill="#20221f">16 px stack gaps</text><text x="40" y="845.36" font-family="Geist Mono" font-size="16" font-weight="400" fill="#20221f">768 px max content</text><text x="420" y="746.28" font-family="Geist Mono" font-size="18" font-weight="600" fill="#20221f">Actions</text><text x="420" y="789.36" font-family="Geist Mono" font-size="16" font-weight="400" fill="#20221f">44 px standard target</text><text x="420" y="817.36" font-family="Geist Mono" font-size="16" font-weight="400" fill="#20221f">56 px primary footer</text><text x="420" y="845.36" font-family="Geist Mono" font-size="16" font-weight="400" fill="#20221f">80 px timer action</text><text x="800" y="746.28" font-family="Geist Mono" font-size="18" font-weight="600" fill="#20221f">Content</text><text x="800" y="789.36" font-family="Geist Mono" font-size="16" font-weight="400" fill="#20221f">Allow multiline labels.</text><text x="800" y="817.36" font-family="Geist Mono" font-size="16" font-weight="400" fill="#20221f">Grow cards with content.</text><text x="800" y="845.36" font-family="Geist Mono" font-size="16" font-weight="400" fill="#20221f">Keep system safe areas.</text><text x="40" y="925.2" font-family="Geist Mono" font-size="20" font-weight="600" fill="#20221f">Interaction &amp; accessibility</text><text x="40" y="979.36" font-family="Geist Mono" font-size="16" font-weight="400" fill="#20221f">Visible labels + icons + color. Never rely on amber alone.</text><text x="40" y="1011.36" font-family="Geist Mono" font-size="16" font-weight="400" fill="#20221f">Web keyboard focus: 3 px ring at 50% opacity.</text><text x="40" y="1043.36" font-family="Geist Mono" font-size="16" font-weight="400" fill="#20221f">Disabled: 50% opacity; remove the action from interaction.</text><text x="40" y="1075.36" font-family="Geist Mono" font-size="16" font-weight="400" fill="#20221f">Disclosure reveal: 150 ms, ease-out (0.23, 1, 0.32, 1).</text><text x="40" y="1107.36" font-family="Geist Mono" font-size="16" font-weight="400" fill="#20221f">Respect system reduced motion. Native font scaling stays enabled.</text><text x="40" y="1139.36" font-family="Geist Mono" font-size="16" font-weight="400" fill="#20221f">The 40 px small primitive is for secondary actions; preserve adequate hit areas.</text><text x="40" y="1305.52" font-family="Geist Mono" font-size="12" font-weight="500" fill="#33352d">No new app behavior is introduced by this library. Static references need real device checks for text scaling and touch.</text></svg>