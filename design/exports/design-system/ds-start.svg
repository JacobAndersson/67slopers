<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1080" viewBox="0 0 1200 1080"><rect width="100%" height="100%" fill="#fafaf7"/><text x="40" y="45.519999999999996" font-family="Geist Mono" font-size="12" font-weight="500" fill="#33352d">67SLOPERS / DESIGN SYSTEM</text><text x="40" y="112.56" font-family="Geist Mono" font-size="36" font-weight="800" fill="#20221f">Built for chalked hands.</text><text x="40" y="159.36" font-family="Geist Mono" font-size="16" font-weight="400" fill="#33352d">A working library for the app we have. Reuse these parts as we explore what comes next.</text><rect x="40" y="230" width="1120" height="280" rx="16" fill="#fae8bd" stroke="none"/><text x="72" y="302.56" font-family="Geist Mono" font-size="36" font-weight="800" fill="#20221f">Legible at a distance.</text><text x="72" y="346.56" font-family="Geist Mono" font-size="36" font-weight="800" fill="#20221f">A few taps to train.</text><text x="72" y="422.28" font-family="Geist Mono" font-size="18" font-weight="600" fill="#20221f">Geist Mono · Pulse / amber · One appearance</text><text x="40" y="589.2" font-family="Geist Mono" font-size="20" font-weight="600" fill="#20221f">01 / Foundations</text><text x="40" y="637.36" font-family="Geist Mono" font-size="16" font-weight="400" fill="#20221f">Semantic tokens, typography,</text><text x="40" y="661.36" font-family="Geist Mono" font-size="16" font-weight="400" fill="#20221f">spacing, layout, motion and</text><text x="40" y="685.36" font-family="Geist Mono" font-size="16" font-weight="400" fill="#20221f">accessibility.</text><text x="420" y="589.2" font-family="Geist Mono" font-size="20" font-weight="600" fill="#20221f">02 / UI components</text><text x="420" y="637.36" font-family="Geist Mono" font-size="16" font-weight="400" fill="#20221f">Drag components from Assets. Select</text><text x="420" y="661.36" font-family="Geist Mono" font-size="16" font-weight="400" fill="#20221f">a copy to change its named variant</text><text x="420" y="685.36" font-family="Geist Mono" font-size="16" font-weight="400" fill="#20221f">properties.</text><text x="800" y="589.2" font-family="Geist Mono" font-size="20" font-weight="600" fill="#20221f">03 / Training patterns</text><text x="800" y="637.36" font-family="Geist Mono" font-size="16" font-weight="400" fill="#20221f">Compose screens from workout,</text><text x="800" y="661.36" font-family="Geist Mono" font-size="16" font-weight="400" fill="#20221f">session, calendar, builder and</text><text x="800" y="685.36" font-family="Geist Mono" font-size="16" font-weight="400" fill="#20221f">timer patterns.</text><text x="40" y="813.2" font-family="Geist Mono" font-size="20" font-weight="600" fill="#20221f">Working together</text><text x="40" y="859.36" font-family="Geist Mono" font-size="16" font-weight="400" fill="#20221f">1  Drag an asset into an exploration board.</text><text x="40" y="887.36" font-family="Geist Mono" font-size="16" font-weight="400" fill="#20221f">2  Override content and choose a variant on the copy.</text><text x="40" y="915.36" font-family="Geist Mono" font-size="16" font-weight="400" fill="#20221f">3  Edit the main component only for an agreed system change.</text><text x="40" y="943.36" font-family="Geist Mono" font-size="16" font-weight="400" fill="#20221f">4  Export reviewed work to design/penpot and design/exports.</text><text x="40" y="1031.52" font-family="Geist Mono" font-size="12" font-weight="500" fill="#33352d">Source of truth: src/global.css + src/lib/theme.ts + src/components. Reviewed 9 October 2026.</text></svg>