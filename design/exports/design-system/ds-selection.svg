eist Mono" font-size="12" font-weight="500" fill="#33352d">Scan</text><path d="M199.81 34a16 16 0 0 0-16.24.43L64 109.23V40a8 8 0 0 0-16 0v176a8 8 0 0 0 16 0v-69.23l119.57 74.78A15.95 15.95 0 0 0 208 208.12V47.88A15.86 15.86 0 0 0 199.81 34M192 208 64.16 128 192 48.07Z" transform="translate(890 758) scale(0.09375)" fill="#20221f" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="880" y="829.52" font-family="Geist Mono" font-size="12" font-weight="500" fill="#33352d">SkipBack</text><path d="M200 32a8 8 0 0 0-8 8v69.23L72.43 34.45A15.95 15.95 0 0 0 48 47.88v160.24a16 16 0 0 0 24.43 13.43L192 146.77V216a8 8 0 0 0 16 0V40a8 8 0 0 0-8-8M64 207.93V48.05l127.84 80Z" transform="translate(1030 758) scale(0.09375)" fill="#20221f" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="1020" y="829.52" font-family="Geist Mono" font-size="12" font-weight="500" fill="#33352d">SkipForward</text><text x="40" y="963.2" font-family="Geist Mono" font-size="20" font-weight="600" fill="#20221f">Icon grammar</text><text x="40" y="1019.36" font-family="Geist Mono" font-size="16" font-weight="400" fill="#20221f">Phosphor Regular: 16 px inline, 20 px actions, 24 px navigation, 36 px feel choices. Bold: 28 px timer controls.</text><text x="40" y="1047.36" font-family="Geist Mono" font-size="16" font-weight="400" fill="#20221f">Label every icon-only action. Brand sloper and board artwork remain separate assets.</text><text x="40" y="1155.52" font-family="Geist Mono" font-size="12" font-weight="500" fill="#33352d">Phosphor icons are bundled locally. Use Battery Low for Weak, Thumbs Up for Normal and Barbell for Strong. MoonBoard symbols remain an exploration.</text></svg>