t-size="16" font-weight="500" fill="#20221f">Next up</text><text x="1070" y="298.44" font-family="Geist Mono" font-size="14" font-weight="500" fill="#20221f">24:10</text><text x="848" y="356.56" font-family="Geist Mono" font-size="36" font-weight="800" fill="#20221f">Repeaters</text><text x="848" y="396.56" font-family="Geist Mono" font-size="36" font-weight="800" fill="#20221f">7:3</text><text x="848" y="432.44" font-family="Geist Mono" font-size="14" font-weight="400" fill="#33352d">6 × (6 × 7s / 3s)</text><text x="848" y="462.44" font-family="Geist Mono" font-size="14" font-weight="400" fill="#33352d">Not done yet</text><g transform="translate(808 -494)"><rect x="40" y="980" width="294" height="56" rx="12" fill="#20221f" stroke="none"/><text x="132.21800000000002" y="1014.44" font-family="Geist Mono" font-size="14" font-weight="500" fill="#ffffff">Start workout</text></g></g><g transform="translate(24 -300)"><text x="40" y="1179.2" font-family="Geist Mono" font-size="20" font-weight="600" fill="#20221f">Your workouts</text><text x="302" y="1176.44" font-family="Geist Mono" font-size="14" font-weight="500" fill="#20221f">View all</text></g><g transform="translate(24 656)"><rect x="40" y="256" width="342" height="116" rx="12" fill="#ffffff" stroke="#d3d5cd"/><text x="56" y="289.36" font-family="Geist Mono" font-size="16" font-weight="600" fill="#20221f">Repeaters 7:3</text><text x="56" y="318.44" font-family="Geist Mono" font-size="14" font-weight="400" fill="#33352d">6 × (6 × 7s / 3s)</text><text x="56" y="354.44" font-family="Geist Mono" font-size="14" font-weight="500" fill="#33352d">24:10</text></g><g transform="translate(24 376)"><text x="40" y="733.36" font-family="Geist Mono" font-size="16" font-weight="600" fill="#20221f">Repeaters 7:3</text><text x="40" y="760.44" font-family="Geist Mono" font-size="14" font-weight="400" fill="#33352d">6 × 6 hangs</text><text x="339.86" y="732.44" font-family="Geist Mono" font-size="14" font-weight="500" fill="#20221f">Today</text><text x="314.576" y="760.44" font-family="Geist Mono" font-size="14" font-weight="400" fill="#33352d">6/6 sets</text><rect x="40" y="789" width="342" height="1" rx="0" fill="#d3d5cd" stroke="none"/></g><text x="510" y="277.04" font-family="Geist Mono" font-size="24" font-weight="600" fill="#20221f">Reuse / modify / review</text><text x="510" y="345.28" font-family="Geist Mono" font-size="18" font-weight="400" fill="#20221f">1  Open Assets → 67slopers.</text><text x="510" y="375.28" font-family="Geist Mono" font-size="18" font-weight="400" fill="#20221f"></text><text x="510" y="405.28" font-family="Geist Mono" font-size="18" font-weight="400" fill="#20221f">2  Drag a UI or Training component into a new board.</text><text x="510" y="435.28" font-family="Geist Mono" font-size="18" font-weight="400" fill="#20221f"></text><text x="510" y="465.28" font-family="Geist Mono" font-size="18" font-weight="400" fill="#20221f">3  Switch the named properties on the instance.</text><text x="510" y="495.28" font-family="Geist Mono" font-size="18" font-weight="400" fill="#20221f"></text><text x="510" y="525.28" font-family="Geist Mono" font-size="18" font-weight="400" fill="#20221f">4  Override the text and keep the shared styles.</text><text x="510" y="555.28" font-family="Geist Mono" font-size="18" font-weight="400" fill="#20221f"></text><text x="510" y="585.28" font-family="Geist Mono" font-size="18" font-weight="400" fill="#20221f">5  Go to the main component for an agreed library change.</text><text x="510" y="897.04" font-family="Geist Mono" font-size="24" font-weight="600" fill="#20221f">Scope of this library</text><text x="510" y="951.36" font-family="Geist Mono" font-size="16" font-weight="400" fill="#20221f">Reference components mirror the existing app. The MoonBoard page</text><text x="510" y="979.36" font-family="Geist Mono" font-size="16" font-weight="400" fill="#20221f">remains an exploration. This design work does not add a new</text><text x="510" y="1007.36" font-family="Geist Mono" font-size="16" font-weight="400" fill="#20221f">screen, protocol or dependency to the app.</text><text x="510" y="1173.2" font-family="Geist Mono" font-size="20" font-weight="600" fill="#20221f">Export reviewed work</text><text x="510" y="1224.44" font-family="Geist Mono" font-size="14" font-weight="400" fill="#33352d">design/penpot/67slopers.penpot</text><text x="510" y="1252.44" font-family="Geist Mono" font-size="14" font-weight="400" fill="#33352d">design/exports/design-system/</text><text x="510" y="1280.44" font-family="Geist Mono" font-size="14" font-weight="400" fill="#33352d">design/foundations/library.json</text></svg>