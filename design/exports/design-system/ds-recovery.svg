<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1420" viewBox="0 0 1200 1420"><rect width="100%" height="100%" fill="#fafaf7"/><text x="40" y="45.519999999999996" font-family="Geist Mono" font-size="12" font-weight="500" fill="#33352d">67SLOPERS / DESIGN SYSTEM</text><text x="40" y="112.56" font-family="Geist Mono" font-size="36" font-weight="800" fill="#20221f">Recovery &amp; completion</text><text x="40" y="159.36" font-family="Geist Mono" font-size="16" font-weight="400" fill="#33352d">A saved session is a fact. Recovery offers distinct choices for interrupted work.</text><rect x="40" y="256" width="390" height="292" rx="16" fill="#f6e7c9" stroke="#d3d5cd"/><text x="64" y="296.44" font-family="Geist Mono" font-size="14" font-weight="400" fill="#33352d">Unfinished workout</text><text x="64" y="343.2" font-family="Geist Mono" font-size="20" font-weight="600" fill="#20221f">Repeaters 7:3</text><text x="64" y="382.44" font-family="Geist Mono" font-size="14" font-weight="400" fill="#33352d">Set 2/6 · stopped 5m ago</text><g transform="translate(24 -566)"><rect x="40" y="980" width="342" height="56" rx="12" fill="#20221f" stroke="none"/><text x="177.288" y="1014.44" font-family="Geist Mono" font-size="14" font-weight="500" fill="#ffffff">Continue</text></g><text x="64" y="512.44" font-family="Geist Mono" font-size="14" font-weight="500" fill="#20221f">Save as ended</text><text x="260" y="512.44" font-family="Geist Mono" font-size="14" font-weight="500" fill="#8a2424">Discard</text><text x="500" y="303.36" font-family="Geist Mono" font-size="16" font-weight="400" fill="#20221f">Continue → resume paused at the checkpoint.</text><text x="500" y="335.36" font-family="Geist Mono" font-size="16" font-weight="400" fill="#20221f">Save as ended → keep performed work.</text><text x="500" y="367.36" font-family="Geist Mono" font-size="16" font-weight="400" fill="#20221f">Discard → confirm, then remove checkpoint.</text><text x="500" y="399.36" font-family="Geist Mono" font-size="16" font-weight="400" fill="#20221f">No silent loss and no fabricated completed sets.</text><text x="40" y="697.8" font-family="Geist Mono" font-size="30" font-weight="700" fill="#20221f">Workout complete</text><text x="40" y="739.36" font-family="Geist Mono" font-size="16" font-weight="400" fill="#33352d">Saved to your history.</text><text x="40" y="813.2" font-family="Geist Mono" font-size="20" font-weight="600" fill="#20221f">How did you feel?</text><g transform="translate(0 126)"><rect x="40" y="730" width="106" height="100" rx="12" fill="#ffffff" stroke="#d3d5cd"/><path d="M200 56H32A24 24 0 0 0 8 80v96a24 24 0 0 0 24 24h168a24 24 0 0 0 24-24V80a24 24 0 0 0-24-24m8 120a8 8 0 0 1-8 8H32a8 8 0 0 1-8-8V80a8 8 0 0 1 8-8h168a8 8 0 0 1 8 8ZM64 96v64a8 8 0 0 1-16 0V96a8 8 0 0 1 16 0m192 0v64a8 8 0 0 1-16 0V96a8 8 0 0 1 16 0" transform="translate(75 746) scale(0.140625)" fill="#20221f" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="73.736" y="809.36" font-family="Geist Mono" font-size="16" font-weight="600" fill="#20221f">Weak</text></g><g transform="translate(-68 -18)"><rect x="226" y="874" width="106" height="100" rx="12" fill="#20221f" stroke="#20221f"/><path d="M234 80.12A24 24 0 0 0 216 72h-56V56a40 40 0 0 0-40-40 8 8 0 0 0-7.16 4.42L75.06 96H32a16 16 0 0 0-16 16v88a16 16 0 0 0 16 16h172a24 24 0 0 0 23.82-21l12-96A24 24 0 0 0 234 80.12M32 112h40v88H32Zm191.94-15-12 96a8 8 0 0 1-7.94 7H88v-94.11l36.71-73.43A24 24 0 0 1 144 56v24a8 8 0 0 0 8 8h64a8 8 0 0 1 7.94 9" transform="translate(261 890) scale(0.140625)" fill="#ffffff" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="250.10399999999998" y="953.36" font-family="Geist Mono" font-size="16" font-weight="600" fill="#ffffff">Normal</text></g><g transform="translate(-136 126)"><rect x="412" y="730" width="106" height="100" rx="12" fill="#ffffff" stroke="#d3d5cd"/><path d="M248 120h-8V88a16 16 0 0 0-16-16h-16v-8a16 16 0 0 0-16-16h-24a16 16 0 0 0-16 16v56h-48V64a16 16 0 0 0-16-16H64a16 16 0 0 0-16 16v8H32a16 16 0 0 0-16 16v32H8a8 8 0 0 0 0 16h8v32a16 16 0 0 0 16 16h16v8a16 16 0 0 0 16 16h24a16 16 0 0 0 16-16v-56h48v56a16 16 0 0 0 16 16h24a16 16 0 0 0 16-16v-8h16a16 16 0 0 0 16-16v-32h8a8 8 0 0 0 0-16M32 168V88h16v80Zm56 24H64V64h24zm104 0h-24V64h24v128m32-24h-16V88h16Z" transform="translate(447 746) scale(0.140625)" fill="#20221f" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="436.104" y="809.36" font-family="Geist Mono" font-size="16" font-weight="600" fill="#20221f">Strong</text></g><text x="630" y="699.36" font-family="Geist Mono" font-size="16" font-weight="400" fill="#20221f">Finish enriches the saved session.</text><text x="630" y="731.36" font-family="Geist Mono" font-size="16" font-weight="400" fill="#20221f">Grade and note are optional.</text><text x="630" y="763.36" font-family="Geist Mono" font-size="16" font-weight="400" fill="#20221f">An unsaved draft can become a workout.</text><text x="630" y="795.36" font-family="Geist Mono" font-size="16" font-weight="400" fill="#20221f">A changed workout reruns the session snapshot.</text><text x="40" y="1083.2" font-family="Geist Mono" font-size="20" font-weight="600" fill="#20221f">Design review checklist</text><text x="40" y="1139.36" font-family="Geist Mono" font-size="16" font-weight="400" fill="#20221f">Can a climber read it from across the room?</text><text x="40" y="1171.36" font-family="Geist Mono" font-size="16" font-weight="400" fill="#20221f">Can they start the last workout in one tap?</text><text x="40" y="1203.36" font-family="Geist Mono" font-size="16" font-weight="400" fill="#20221f">Are actual and planned values clearly distinguished?</text><text x="40" y="1235.36" font-family="Geist Mono" font-size="16" font-weight="400" fill="#20221f">Do recovery and destructive actions explain what is kept?</text><text x="40" y="1267.36" font-family="Geist Mono" font-size="16" font-weight="400" fill="#20221f">Does the design work entirely offline, with no account?</text></svg>