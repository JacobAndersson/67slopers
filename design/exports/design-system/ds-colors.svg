"500" fill="#33352d">#7B8072</text><rect x="990" y="400" width="164" height="82" rx="12" fill="#9c5500" stroke="#d3d5cd"/><text x="990" y="507.52" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">ring</text><text x="990" y="529.52" font-family="Geist Mono" font-size="12" font-weight="500" fill="#33352d">#9C5500</text><rect x="40" y="562" width="164" height="82" rx="12" fill="#f9c65d" stroke="#d3d5cd"/><text x="40" y="669.52" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">chart1</text><text x="40" y="691.52" font-family="Geist Mono" font-size="12" font-weight="500" fill="#33352d">#F9C65D</text><rect x="230" y="562" width="164" height="82" rx="12" fill="#f6e7c9" stroke="#d3d5cd"/><text x="230" y="669.52" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">chart2</text><text x="230" y="691.52" font-family="Geist Mono" font-size="12" font-weight="500" fill="#33352d">#F6E7C9</text><rect x="420" y="562" width="164" height="82" rx="12" fill="#9c5500" stroke="#d3d5cd"/><text x="420" y="669.52" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">chart3</text><text x="420" y="691.52" font-family="Geist Mono" font-size="12" font-weight="500" fill="#33352d">#9C5500</text><rect x="610" y="562" width="164" height="82" rx="12" fill="#33352d" stroke="#d3d5cd"/><text x="610" y="669.52" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">chart4</text><text x="610" y="691.52" font-family="Geist Mono" font-size="12" font-weight="500" fill="#33352d">#33352D</text><rect x="800" y="562" width="164" height="82" rx="12" fill="#dfe9ee" stroke="#d3d5cd"/><text x="800" y="669.52" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">chart5</text><text x="800" y="691.52" font-family="Geist Mono" font-size="12" font-weight="500" fill="#33352d">#DFE9EE</text><rect x="990" y="562" width="164" height="82" rx="12" fill="#8a2424" stroke="#d3d5cd"/><text x="990" y="669.52" font-family="Geist Mono" font-size="12" font-weight="500" fill="#20221f">destructive</text><text x="990" y="691.52" font-family="Geist Mono" font-size="12" font-weight="500" fill="#33352d">#8A2424</text><text x="40" y="791.2" font-family="Geist Mono" font-size="20" font-weight="600" fill="#20221f">The timer phase language</text><rect x="40" y="820" width="208" height="116" rx="12" fill="#f6e7c9" stroke="#d3d5cd"/><text x="100.656" y="881.36" font-family="Geist Mono" font-size="16" font-weight="600" fill="#20221f">Get ready</text><rect x="268" y="820" width="208" height="116" rx="12" fill="#f9c65d" stroke="#d3d5cd"/><text x="352.736" y="881.36" font-family="Geist Mono" font-size="16" font-weight="600" fill="#20221f">Hang</text><rect x="496" y="820" width="208" height="116" rx="12" fill="#fae8bd" stroke="#d3d5cd"/><text x="561.472" y="881.36" font-family="Geist Mono" font-size="16" font-weight="600" fill="#20221f">Rep rest</text><rect x="724" y="820" width="208" height="116" rx="12" fill="#dfe9ee" stroke="#d3d5cd"/><text x="789.472" y="881.36" font-family="Geist Mono" font-size="16" font-weight="600" fill="#20221f">Set rest</text><rect x="952" y="820" width="208" height="116" rx="12" fill="#fafaf7" stroke="#d3d5cd"/><text x="998.208" y="881.36" font-family="Geist Mono" font-size="16" font-weight="600" fill="#20221f">Ready / done</text><text x="40" y="1009.36" font-family="Geist Mono" font-size="16" font-weight="400" fill="#20221f">Pair every phase color with a label and countdown. Charcoal carries primary actions. Red marks destructive</text><text x="40" y="1033.36" font-family="Geist Mono" font-size="16" font-weight="400" fill="#20221f">actions and ended-session facts.</text><text x="40" y="1131.52" font-family="Geist Mono" font-size="12" font-weight="500" fill="#33352d">Aliases such as cardForeground, secondaryForeground and popoverForeground remain available in Assets and Tokens.</text></svg>