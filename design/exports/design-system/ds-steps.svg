y="Geist Mono" font-size="20" font-weight="600" fill="#20221f">Repeat group</text><rect x="40" y="888" width="370" height="294" rx="12" fill="none" stroke="#d3d5cd"/><path d="M24 128a72.08 72.08 0 0 1 72-72h108.69l-10.35-10.34a8 8 0 0 1 11.32-11.32l24 24a8 8 0 0 1 0 11.32l-24 24a8 8 0 0 1-11.32-11.32L204.69 72H96a56.06 56.06 0 0 0-56 56 8 8 0 0 1-16 0m200-8a8 8 0 0 0-8 8 56.06 56.06 0 0 1-56 56H51.31l10.35-10.34a8 8 0 0 0-11.32-11.32l-24 24a8 8 0 0 0 0 11.32l24 24a8 8 0 0 0 11.32-11.32L51.31 200H160a72.08 72.08 0 0 0 72-72 8 8 0 0 0-8-8" transform="translate(54 904) scale(0.078125)" fill="#20221f" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="82" y="920.28" font-family="Geist Mono" font-size="18" font-weight="600" fill="#20221f">6 times</text><path d="M140 128a12 12 0 1 1-12-12 12 12 0 0 1 12 12m-12-56a12 12 0 1 0-12-12 12 12 0 0 0 12 12m0 112a12 12 0 1 0 12 12 12 12 0 0 0-12-12" transform="translate(374 902) scale(0.09375)" fill="#20221f" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(-366 534)"><rect x="420" y="412" width="342" height="72" rx="12" fill="#ffffff" stroke="#d3d5cd"/><rect x="420" y="412" width="6" height="72" rx="3" fill="#f9c65d" stroke="none"/><text x="438" y="441.36" font-family="Geist Mono" font-size="16" font-weight="500" fill="#20221f">Hang</text><text x="438" y="466.44" font-family="Geist Mono" font-size="14" font-weight="400" fill="#33352d">7s</text><path d="m213.66 101.66-80 80a8 8 0 0 1-11.32 0l-80-80a8 8 0 0 1 11.32-11.32L128 164.69l74.34-74.35a8 8 0 0 1 11.32 11.32" transform="translate(686 440) scale(0.0625)" fill="#20221f" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M140 128a12 12 0 1 1-12-12 12 12 0 0 1 12 12m-12-56a12 12 0 1 0-12-12 12 12 0 0 0 12 12m0 112a12 12 0 1 0 12 12 12 12 0 0 0-12-12" transform="translate(726 436) scale(0.09375)" fill="#20221f" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(-746 618)"><rect x="800" y="412" width="342" height="72" rx="12" fill="#ffffff" stroke="#d3d5cd"/><rect x="800" y="412" width="6" height="72" rx="3" fill="#dfe9ee" stroke="none"/><text x="818" y="441.36" font-family="Geist Mono" font-size="16" font-weight="500" fill="#20221f">Rest</text><text x="818" y="466.44" font-family="Geist Mono" font-size="14" font-weight="400" fill="#33352d">3:00</text><path d="m213.66 101.66-80 80a8 8 0 0 1-11.32 0l-80-80a8 8 0 0 1 11.32-11.32L128 164.69l74.34-74.35a8 8 0 0 1 11.32 11.32" transform="translate(1066 440) scale(0.0625)" fill="#20221f" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M140 128a12 12 0 1 1-12-12 12 12 0 0 1 12 12m-12-56a12 12 0 1 0-12-12 12 12 0 0 0 12 12m0 112a12 12 0 1 0 12 12 12 12 0 0 0-12-12" transform="translate(1106 436) scale(0.09375)" fill="#20221f" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(-174 864)"><rect x="228" y="260" width="342" height="40" rx="10" fill="#fae8bd" stroke="none"/><text x="365.288" y="286.44" font-family="Geist Mono" font-size="14" font-weight="500" fill="#20221f">Add step</text></g><text x="476" y="923.36" font-family="Geist Mono" font-size="16" font-weight="400" fill="#20221f">Repeat boundary / 2 px</text><text x="476" y="955.36" font-family="Geist Mono" font-size="16" font-weight="400" fill="#20221f">Inner stack / 12 px gaps</text><text x="476" y="987.36" font-family="Geist Mono" font-size="16" font-weight="400" fill="#20221f">Rows stay inside their parent group.</text><text x="476" y="1019.36" font-family="Geist Mono" font-size="16" font-weight="400" fill="#20221f">Reorder one list at a time.</text><text x="476" y="1051.36" font-family="Geist Mono" font-size="16" font-weight="400" fill="#20221f">Use Move into / Move out for hierarchy.</text><text x="476" y="1083.36" font-family="Geist Mono" font-size="16" font-weight="400" fill="#20221f">Grip selection belongs on Hang only.</text><text x="40" y="1283.36" font-family="Geist Mono" font-size="16" font-weight="400" fill="#20221f">Editing is inline. Expanding a row reveals the kind selector, duration stepper, optional grip cue and label. One</text><text x="40" y="1311.36" font-family="Geist Mono" font-size="16" font-weight="400" fill="#20221f">row opens at a time.</text><text x="40" y="1433.52" font-family="Geist Mono" font-size="12" font-weight="500" fill="#33352d">Source: step-list.tsx, stepper.tsx, workout-steps.ts. No additional nesting or new workout model is implied.</text></svg>