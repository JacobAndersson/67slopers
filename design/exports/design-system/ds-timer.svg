<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500"><rect width="100%" height="100%" fill="#fafaf7"/><text x="40" y="45.519999999999996" font-family="Geist Mono" font-size="12" font-weight="500" fill="#33352d">67SLOPERS / DESIGN SYSTEM</text><text x="40" y="112.56" font-family="Geist Mono" font-size="36" font-weight="800" fill="#20221f">The timer stays unmistakable.</text><text x="40" y="159.36" font-family="Geist Mono" font-size="16" font-weight="400" fill="#33352d">Phase, set/rep and countdown form the hierarchy. These are component samples; full-screen references remain on</text><text x="40" y="183.36" font-family="Geist Mono" font-size="16" font-weight="400" fill="#33352d">page 04.</text><rect x="40" y="250" width="532" height="264" rx="16" fill="#f6e7c9" stroke="none"/><text x="240.984" y="297.04" font-family="Geist Mono" font-size="24" font-weight="600" fill="#20221f">GET READY</text><text x="183.192" y="343.04" font-family="Geist Mono" font-size="24" font-weight="600" fill="#20221f">Set 1/6 · Rep 1/6</text><text x="233.76" y="479.2" font-family="Geist Mono" font-size="120" font-weight="700" fill="#20221f">10</text><rect x="610" y="250" width="532" height="264" rx="16" fill="#f9c65d" stroke="none"/><text x="847.104" y="297.04" font-family="Geist Mono" font-size="24" font-weight="600" fill="#20221f">HANG</text><text x="753.192" y="343.04" font-family="Geist Mono" font-size="24" font-weight="600" fill="#20221f">Set 1/6 · Rep 1/6</text><text x="803.76" y="479.2" font-family="Geist Mono" font-size="120" font-weight="700" fill="#20221f">07</text><rect x="40" y="560" width="532" height="264" rx="16" fill="#fae8bd" stroke="none"/><text x="277.104" y="607.04" font-family="Geist Mono" font-size="24" font-weight="600" fill="#20221f">REST</text><text x="183.192" y="653.04" font-family="Geist Mono" font-size="24" font-weight="600" fill="#20221f">Set 1/6 · Rep 1/6</text><text x="233.76" y="789.2" font-family="Geist Mono" font-size="120" font-weight="700" fill="#20221f">03</text><rect x="610" y="560" width="532" height="264" rx="16" fill="#dfe9ee" stroke="none"/><text x="847.104" y="607.04" font-family="Geist Mono" font-size="24" font-weight="600" fill="#20221f">REST</text><text x="753.192" y="653.04" font-family="Geist Mono" font-size="24" font-weight="600" fill="#20221f">Set 1/6 · Rep 1/6</text><text x="731.52" y="789.2" font-family="Geist Mono" font-size="120" font-weight="700" fill="#20221f">3:00</text><text x="40" y="987.2" font-family="Geist Mono" font-size="20" font-weight="600" fill="#20221f">Primary timer action</text><rect x="40" y="1024" width="532" height="80" rx="12" fill="#20221f" stroke="none"/><path d="M200 28h-40a20 20 0 0 0-20 20v160a20 20 0 0 0 20 20h40a20 20 0 0 0 20-20V48a20 20 0 0 0-20-20m-4 176h-32V52h32ZM96 28H56a20 20 0 0 0-20 20v160a20 20 0 0 0 20 20h40a20 20 0 0 0 20-20V48a20 20 0 0 0-20-20m-4 176H60V52h32Z" transform="translate(228 1050) scale(0.109375)" fill="#ffffff" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="270" y="1071.2" font-family="Geist Mono" font-size="20" font-weight="600" fill="#ffffff">Pause</text><rect x="610" y="1024" width="532" height="80" rx="12" fill="#20221f" stroke="none"/><path d="M234.49 111.07 90.41 22.94A20 20 0 0 0 60 39.87v176.26a20 20 0 0 0 30.41 16.93l144.08-88.13a19.82 19.82 0 0 0 0-33.86M84 208.85V47.15L216.16 128Z" transform="translate(798 1050) scale(0.109375)" fill="#ffffff" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="840" y="1071.2" font-family="Geist Mono" font-size="20" font-weight="600" fill="#ffffff">Resume</text><rect x="40" y="1212" width="532" height="76" rx="12" fill="#fafaf7" stroke="#d3d5cd"/><text x="56" y="1240.44" font-family="Geist Mono" font-size="14" font-weight="400" fill="#33352d">Next up</text><text x="56" y="1271.36" font-family="Geist Mono" font-size="16" font-weight="500" fill="#20221f">Hang · 7s</text><text x="630" y="1231.36" font-family="Geist Mono" font-size="16" font-weight="400" fill="#20221f">Pause exposes previous / skip controls.</text><text x="630" y="1259.36" font-family="Geist Mono" font-size="16" font-weight="400" fill="#20221f">End workout remains a deliberate secondary action.</text><text x="630" y="1287.36" font-family="Geist Mono" font-size="16" font-weight="400" fill="#20221f">Gameplay is optional, bundled and always muted.</text><text x="40" y="1417.52" font-family="Geist Mono" font-size="12" font-weight="500" fill="#33352d">Interval boundary feedback: one beep and one heavy tap. Each setting is optional and remembered on device.</text></svg>