xt><rect x="548" y="916" width="44" height="44" rx="10" fill="#fafaf7" stroke="#d3d5cd"/><text x="563.98" y="947.2" font-family="Geist Mono" font-size="20" font-weight="600" fill="#20221f">+</text><rect x="472" y="916" width="68" height="44" rx="10" fill="#fafaf7" stroke="#d3d5cd"/><text x="499.98" y="947.2" font-family="Geist Mono" font-size="20" font-weight="600" fill="#20221f">7</text><text x="420" y="1021.52" font-family="Geist Mono" font-size="12" font-weight="500" fill="#33352d">number entry</text><text x="800" y="895.36" font-family="Geist Mono" font-size="16" font-weight="500" fill="#20221f">Duration</text><rect x="800" y="916" width="60" height="44" rx="10" fill="#fafaf7" stroke="#d3d5cd"/><text x="817.96" y="947.2" font-family="Geist Mono" font-size="20" font-weight="600" fill="#20221f">03</text><rect x="884" y="916" width="60" height="44" rx="10" fill="#fafaf7" stroke="#d3d5cd"/><text x="901.96" y="947.2" font-family="Geist Mono" font-size="20" font-weight="600" fill="#20221f">00</text><text x="864" y="947.2" font-family="Geist Mono" font-size="20" font-weight="600" fill="#20221f">:</text><text x="800" y="1021.52" font-family="Geist Mono" font-size="12" font-weight="500" fill="#33352d">clock entry</text><text x="40" y="1121.36" font-family="Geist Mono" font-size="16" font-weight="400" fill="#20221f">Tap a value for direct entry. Hold −/+ to repeat after 300 ms, every 80 ms. Values clamp to valid limits; minutes</text><text x="40" y="1149.36" font-family="Geist Mono" font-size="16" font-weight="400" fill="#20221f">and seconds are separate clock fields.</text></svg>