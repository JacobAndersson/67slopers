<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1280" viewBox="0 0 1200 1280"><rect width="100%" height="100%" fill="#fafaf7"/><text x="40" y="45.519999999999996" font-family="Geist Mono" font-size="12" font-weight="500" fill="#33352d">67SLOPERS / DESIGN SYSTEM</text><text x="40" y="112.56" font-family="Geist Mono" font-size="36" font-weight="800" fill="#20221f">Fields &amp; numeric entry</text><text x="40" y="159.36" font-family="Geist Mono" font-size="16" font-weight="400" fill="#33352d">Input is 40 px on mobile; the builder can override height. Focus and invalid styling are web states.</text><text x="40" y="233.52" font-family="Geist Mono" font-size="12" font-weight="500" fill="#33352d">empty</text><rect x="40" y="248" width="342" height="40" rx="10" fill="#fafaf7" stroke="#7b8072"/><text x="52" y="275.36" font-family="Geist Mono" font-size="16" font-weight="400" fill="#33352d">Workout name</text><text x="420" y="233.52" font-family="Geist Mono" font-size="12" font-weight="500" fill="#33352d">filled</text><rect x="420" y="248" width="342" height="40" rx="10" fill="#fafaf7" stroke="#7b8072"/><text x="432" y="275.36" font-family="Geist Mono" font-size="16" font-weight="400" fill="#20221f">Repeaters 7:3</text><text x="800" y="233.52" font-family="Geist Mono" font-size="12" font-weight="500" fill="#33352d">focus</text><rect x="800" y="248" width="342" height="40" rx="10" fill="#fafaf7" stroke="#9c5500"/><text x="812" y="275.36" font-family="Geist Mono" font-size="16" font-weight="400" fill="#20221f">Repeaters 7:3</text><text x="40" y="375.52" font-family="Geist Mono" font-size="12" font-weight="500" fill="#33352d">disabled</text><rect x="40" y="390" width="342" height="40" rx="10" fill="#fafaf7" stroke="#7b8072"/><text x="52" y="417.36" font-family="Geist Mono" font-size="16" font-weight="400" fill="#20221f">Repeaters 7:3</text><text x="420" y="375.52" font-family="Geist Mono" font-size="12" font-weight="500" fill="#33352d">invalid</text><rect x="420" y=